{{define "content"}}
<div style="display:flex; justify-content:space-between; align-items:center">
  <h2>New Transaction</h2>
  <a href="/transactions" role="button" class="outline">Cancel</a>
</div>
{{if .Error}}<p class="danger">{{.Error}}</p>{{end}}
<article>
  <form method="POST" action="/transactions">
    <div class="grid">
      <label>
        Account
        <select name="account_id" required>
          <option value="">Select account...</option>
          {{range .Accounts}}
          <option value="{{.ID}}">{{.Name}} ({{.Type}})</option>
          {{end}}
        </select>
      </label>
      <label>
        Type
        <select name="type" required>
          {{range .Types}}
          <option value="{{.}}">{{.}}</option>
          {{end}}
        </select>
      </label>
    </div>

    <label>
      Security
      <input type="search"
             placeholder="Type ticker to search..."
             hx-get="/securities/search"
             hx-target="#security-results"
             hx-trigger="keyup changed delay:300ms"
             hx-include="[name='security_search_input']"
             name="security_search_input"
             id="security_search_input"
             autocomplete="off">
      <div id="security-results" style="border: 1px solid var(--pico-border-color); border-radius: var(--pico-border-radius); margin-top: -1rem; display:none"></div>
      <input type="hidden" name="security_id" id="security_id_field" required>
      <small id="selected-security-label"></small>
    </label>

    <div class="grid">
      <label>
        Trade Date
        <input type="date" name="trade_date" required>
      </label>
      <label>
        Settled Date
        <input type="date" name="settled_date" required>
      </label>
    </div>

    <div class="grid">
      <label>
        Quantity
        <input type="text" name="quantity" required placeholder="e.g. 100">
      </label>
      <label>
        Price (native currency)
        <input type="text" name="price_native" required placeholder="e.g. 25.50">
      </label>
    </div>

    <div class="grid">
      <label>
        Commission (native currency)
        <input type="text" name="commission_native" value="0" placeholder="e.g. 4.95">
      </label>
      <label>
        FX Rate (leave blank if CAD)
        <input type="text" name="fx_rate" placeholder="e.g. 1.3650">
      </label>
    </div>

    <label>
      Notes <small>(optional)</small>
      <input type="text" name="notes" placeholder="">
    </label>

    <button type="submit">Add Transaction</button>
  </form>
</article>
<script>
function selectSecurity(id, label) {
  document.getElementById('security_id_field').value = id;
  document.getElementById('selected-security-label').textContent = 'Selected: ' + label;
  document.getElementById('security-results').innerHTML = '';
  document.getElementById('security-results').style.display = 'none';
  document.getElementById('security_search_input').value = label;
}
</script>
{{end}}
