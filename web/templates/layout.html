{{define "layout"}}
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pacioli</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.1.1/css/pico.min.css"
        integrity="sha384-L1dWfspMTHU/ApYnFiMz2QID/PlP1xCW9visvBdbEkOLkSSWsP6ZJWhPw6apiXxU"
        crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js"
          integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V"
          crossorigin="anonymous"></script>
  <style>
    /* Semantic tokens inlined to avoid a static file handler — use these, not raw --pico-* internals */
    :root {
      --state-gain:    var(--pico-ins-color);
      --state-loss:    var(--pico-del-color);
      --state-flag-bg: var(--pico-mark-background-color);
      --state-flag-fg: var(--pico-mark-color);

      --text-body:    var(--pico-color);
      --text-muted:   var(--pico-muted-color);
      --text-heading: var(--pico-h2-color);

      --color-surface:        var(--pico-card-background-color);
      --color-surface-sunken: var(--pico-card-sectioning-background-color);
      --color-border:         var(--pico-muted-border-color);

      --accent:       var(--pico-primary);
      --accent-hover: var(--pico-primary-hover);

      --font-mono:  var(--pico-font-family-monospace);
      --btn-sm-pad: 0.25rem 0.5rem;
      --text-sm:    0.875rem;
      --text-xs:    0.75rem;
    }

    nav a              { text-decoration: none; }
    table td, table th { vertical-align: middle; }
    .actions           { white-space: nowrap; }

    .gain    { color: var(--state-gain); }
    .loss    { color: var(--state-loss); }
    .danger  { color: var(--state-loss); --pico-color: var(--state-loss); }
    .success { color: var(--state-gain); --pico-color: var(--state-gain); }
    .muted   { color: var(--text-muted); }
    .mono    { font-family: var(--font-mono); }
    .btn-sm  { padding: var(--btn-sm-pad); font-size: var(--text-sm); }

    /* color-mix for disposal row — no simpler expression available */
    .disposal-row { background: color-mix(in srgb, var(--accent) 10%, transparent); }

    /* badge CSS lives here, not in admin_audit.html's per-page <style> */
    .badge         { display:inline-block; padding:0.1rem 0.4rem; border-radius:4px; font-size:0.75rem; font-weight:600; text-transform:uppercase; }
    .badge-create  { background:var(--state-gain); color:#fff; }
    .badge-update  { background:var(--accent); color:#fff; }
    .badge-delete  { background:var(--state-loss); color:#fff; }
  </style>
</head>
<body hx-boost="true">
<nav class="container-fluid">
  <ul>
    <li><strong><a href="/" class="contrast">Pacioli</a></strong></li>
  </ul>
  {{if .CurrentUser}}
  <ul>
    <li><a href="/acb">ACB</a></li>
    <li><a href="/gains">Gains</a></li>
    <li><a href="/accounts">Accounts</a></li>
    <li><a href="/securities">Securities</a></li>
    <li><a href="/transactions">Transactions</a></li>
    <li><a href="/import">Import</a></li>
    <li><a href="/questrade">Questrade</a></li>
    {{if .CurrentUser.IsAdmin}}<li><a href="/admin/users">Users</a></li><li><a href="/admin/audit">Audit</a></li>{{end}}
  </ul>
  <ul>
    <li><small>{{.CurrentUser.Email}}</small></li>
    <li><a href="/profile/password">Profile</a></li>
    <li>
      <form method="POST" action="/logout" style="margin:0">
        <button type="submit" class="outline secondary btn-sm">Logout</button>
      </form>
    </li>
  </ul>
  {{end}}
</nav>
<main class="container">
  {{template "content" .Data}}
</main>
</body>
</html>
{{end}}
