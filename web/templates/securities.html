{{define "content"}}
<div style="display:flex; justify-content:space-between; align-items:center">
  <h2>Securities</h2>
  <a href="/securities/new" role="button">Add Security</a>
</div>
{{if .Error}}<p class="danger">{{.Error}}</p>{{end}}
<form method="GET" action="/securities" style="max-width:400px">
  <div role="group">
    <input type="search" name="q" value="{{.Query}}" placeholder="Search ticker or name...">
    <button type="submit">Search</button>
  </div>
</form>
{{if .Securities}}
<figure>
  <table>
    <thead>
      <tr>
        <th>Ticker</th>
        <th>Exchange</th>
        <th>Name</th>
        <th>Type</th>
        <th>Currency</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      {{range .Securities}}
      <tr id="sec-row-{{.ID}}">
        <td><strong>{{.Ticker}}</strong></td>
        <td>{{if .Exchange}}{{.Exchange}}{{else}}<span style="color:var(--pico-muted-color);font-size:0.85rem">unlisted</span>{{end}}</td>
        <td>{{.Name}}</td>
        <td>{{.Type}}</td>
        <td>{{.Currency}}</td>
        <td class="actions" style="white-space:nowrap">
          <a href="/securities/{{.ID}}/edit"
             role="button" class="outline secondary"
             style="padding:0.25rem 0.5rem;font-size:0.875rem">Edit</a>
          <button
            hx-delete="/securities/{{.ID}}"
            hx-target="#sec-row-{{.ID}}"
            hx-swap="outerHTML"
            hx-confirm="Delete {{.Ticker}}? This cannot be undone."
            hx-on:htmx:after-request="if(!event.detail.successful) alert(event.detail.xhr.responseText)"
            class="outline danger"
            style="padding:0.25rem 0.5rem;font-size:0.875rem">Delete</button>
        </td>
      </tr>
      {{end}}
    </tbody>
  </table>
</figure>
{{else}}
<article><p>No securities found{{if .Query}} for "{{.Query}}"{{end}}.</p></article>
{{end}}
{{end}}
